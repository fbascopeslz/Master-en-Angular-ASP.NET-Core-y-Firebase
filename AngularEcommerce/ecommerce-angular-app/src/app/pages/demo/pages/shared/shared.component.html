<h2>Angular Forms</h2>

<form [formGroup]="form" novalidate autocomplete="off" (ngSubmit)="onSubmit()">
    <app-button (click)="organizeElement()">Organize</app-button>
    <app-button (click)="onPatchValue()">Add text</app-button>
    <br>
    <br>
    <app-form-field label="Input Fernando" [required]="true" [control]="form.controls['myInput']" [isInline]="isInline">
        <app-input formControlName="myInput"></app-input>
    </app-form-field>
</form>
